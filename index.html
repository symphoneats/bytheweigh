<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>By The Weigh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  :root {
    --bg: #FFFFFF;
    --ink: #1C1C1C;
    --ink-soft: #4A4A44;
    --muted: #767066;
    --line: #E3E0D8;
    --accent: #1F4B3F;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 48px 24px; text-align: center; }
  .kicker { font-size: 14px; font-weight: 500; letter-spacing: 0.01em; color: var(--muted); margin-bottom: 16px; }
  h1 { font-size: 48px; font-weight: 700; margin: 0 0 20px; line-height: 1.08; }
  p.lead { font-size: 17px; color: var(--ink-soft); line-height: 1.65; margin: 0 auto 32px; max-width: 460px; }
  .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .btn { display: inline-block; background: var(--accent); color: var(--bg); padding: 13px 26px; border-radius: 6px; text-decoration: none; font-size: 15px; font-weight: 600; }
  .btn-outline { display: inline-block; background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 11.5px 24px; border-radius: 6px; text-decoration: none; font-size: 15px; font-weight: 600; }
  .credit { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; margin-top: 24px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">An executive metabolic care program</div>
    <h1>By The Weigh</h1>
    <p class="lead">Six months of integrated endocrinologist and dietitian care, built for people who are serious about their weight and health goals and want sustainable results, not a quick fix.</p>
  </div>

<!-- Calendly badge widget begin -->
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
<script type="text/javascript">window.onload = function() { Calendly.initBadgeWidget({ url: 'https://calendly.com/k-symphoneats/30min', text: 'Schedule a quick call', color: '#0069ff', textColor: '#ffffff', branding: true }); }</script>
<!-- Calendly badge widget end -->
</body>
</html>
